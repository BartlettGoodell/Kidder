<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/Favicon.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolland Kidder Opinion Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #1a1208;
    --ink-mid:    #3d2e1a;
    --ink-light:  #7a6650;
    --paper:      #faf6ee;
    --paper-mid:  #f0e9d9;
    --paper-dark: #e2d6c0;
    --rule:       #c8b898;
    --accent:     #8b2020;
    --accent-pale:#f5e8e8;
    --mono:       'DM Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }
/* ===== Masthead (clean + responsive) ===== */

.masthead{
  position: relative;
  height: clamp(80px, 13vw, 100px); /* give it a real max */
  overflow: hidden;

  background-image:
    linear-gradient(to bottom,
      rgba(0,0,0,.35),
      rgba(0,0,0,.15) 35%,
      rgba(0,0,0,.35)
    ),
    url("/assets/banner/wide_background.png");
  background-size: cover;
  background-position: center bottom;
}

/* Layout: type + portrait “hug” each other */
.masthead-inner{
  position: relative;
  height: 100%;
  max-width: 1200px;
  margin: 0 auto;

  display: flex;
  align-items: center;     /* lets portrait fill height */
  justify-content: center;  /* centers the group */
  gap: clamp(10px, 1.6vw, 18px); /* controls “hug” distance */
  padding: 0 20px;          /* no bottom padding needed if portrait is flush */
}

/* No fake reserved space. Let flex do the work. */
.masthead-type{
  text-align: center;
}

.masthead-title{
  font-family: "Bodoni Old Style", serif;
  font-size: clamp(30px, 5.5vw, 54px);
  letter-spacing: -0.02em;
  line-height: 0.95;
  color: rgba(255,255,255,.95);
  text-shadow: 0 6px 14px rgba(0,0,0,.35);
}

.masthead-subtitle{
  margin-top: 6px;
  font-family: "Bodoni Old Style", serif;
  font-size: clamp(11px, 1.8vw, 18px);
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: rgba(255,255,255,.9);
}

/* Portrait: in normal flow, flush top/bottom */
.masthead-portrait{
  height: 100%;
  width: auto;
  display: block;
  align-self: stretch;     /* fill masthead height */
  object-fit: contain;     /* keep aspect, no cropping */
  pointer-events: none;
}

/* Mobile: hide portrait AND shrink masthead */
@media (max-width: 600px){
  .masthead{
    height: clamp(70px, 16vw, 84px);
  }
  .masthead-inner{
    gap: 0;
  }
  .masthead-portrait{
    display: none;
  }
}

  /* ── Controls Bar ─────────────────────────────────────── */
  .controls {
    background: var(--paper-mid);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }
  .search-wrap svg {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-light);
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    padding: 0.55rem 0.75rem 0.55rem 2.4rem;
    border: 1.5px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.82rem;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--ink-light); }

  select, input[type="date"] {
    padding: 0.55rem 0.75rem;
    border: 1.5px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.82rem;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus, input[type="date"]:focus { border-color: var(--accent); }

  .date-range {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-light);
  }

  .btn {
    padding: 0.5rem 1rem;
    border: 1.5px solid var(--rule);
    background: var(--paper);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-accent {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-accent:hover { background: #6b1818; border-color: #6b1818; }

  .sort-label {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── Topic Pills ──────────────────────────────────────── */
  .topic-bar {
    padding: 0.7rem 2rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: center;
    background: var(--paper);
  }
  .topic-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 0.3rem;
  }
  .pill {
    padding: 0.25rem 0.75rem;
    border: 1.5px solid var(--rule);
    background: var(--paper-mid);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: 0.72rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .pill.all-pill { font-weight: 500; }

  /* ── Layout ───────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    height: calc(100vh - 260px);
  }
  /* =========================================================
   ALT DESKTOP BEHAVIOR (v19)
   - Compact tile grid on desktop
   - Full-screen reader overlay on ALL breakpoints (desktop too)
   - Sleeker, tighter controls
   - Hide masthead subtext
   ========================================================= */

.masthead-sub{display:none !important;}

/* Reader bar should exist on desktop too */
.readerBar{
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid rgba(43,35,26,.14);
  padding: 10px 12px;
  margin: 0;
  
  display:flex;
  align-items:center;
  gap:10px;
}
.readerBar .back{
  border:1px solid rgba(0,0,0,.28);
  border-radius:12px;
  padding:10px 14px;
  background:rgba(255,255,255,.55);
  cursor:pointer;
  font: 600 14px/1 'Source Serif 4', Georgia, serif;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.readerBar .back:hover{background:rgba(255,255,255,.85);}

@media (min-width: 901px){
  /* Controls a bit tighter */
  .controls{padding:10px 14px;}
  .search-input{height:40px;}
  .filters-btn{height:40px;}
  .sort-select{height:40px;}

  /* Tiles-only layout */
  .layout{grid-template-columns:1fr;}
  .tiles{grid-template-columns:repeat(3, minmax(0, 1fr)); gap: 14px;}
  .tile{padding: 10px 12px;}
  .tile-title{font-size:22px; line-height:1.05;}
  .tile-meta{font-size:12px;}
  .preview-empty{display:none;}

  /* Full-screen reader overlay */
  .preview-panel{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--paper);
    border-left:none;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    transform:translateX(105%);
    transition:transform .24s ease;
    overflow:auto;
  }
  body.reader-open .preview-panel{transform:translateX(0);}
  body.reader-open .masthead,
  body.reader-open .controls,
  body.reader-open .tile-panel,
  body.reader-open .statusbar{display:none;}
}

@media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .preview-panel { display: none; }
    .preview-panel.mobile-open { display: flex; position: fixed; inset: 0; z-index: 200; }
  }

  /* ── Article Grid ─────────────────────────────────────── */
  .article-grid {
    padding: 2.2rem 2.4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
    align-content: start;
    border-right: 1px solid var(--rule);
    height: 100%;
    overflow-y: auto;
  }

    .article-card {
    background: #fbf7ef;
    border: 1px solid rgba(43,35,26,.18);
    padding: 1.4rem 1.5rem 1.2rem;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease;
    position: relative;
    overflow: hidden;
    min-height: 132px;
    box-shadow: 0 10px 28px rgba(0,0,0,.05);
  }
  .article-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: rgba(200,184,152,.9);
    transition: background 0.18s ease;
  }
  .article-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 18px 38px rgba(139,32,32,0.12); }
  .article-card:hover::before { background: var(--accent); }
  .article-card.selected {
    border-color: var(--accent);
    background: var(--accent-pale);
  }
  .article-card.selected::before { background: var(--accent); }

  .feature-package,
  .archive-resume {
    grid-column: 1 / -1;
  }

  .feature-package {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-auto-rows: minmax(118px, auto);
    gap: 10px;
    padding: 12px;
    background: #8d1f1d;
    border: 1px solid rgba(43,35,26,.55);
    box-shadow: 0 16px 36px rgba(0,0,0,.18);
  }

  .feature-hero {
    grid-column: span 7;
    grid-row: span 2;
    min-height: 271px;
    position: relative;
    z-index: 3;
    overflow: visible;
    display: grid;
    grid-template-rows: 52px 1fr 18px;
    border: 2px solid #e4c36f;
    background: #082442;
    color: #fffaf0;
  }

  .feature-hero::before {
    content: none;
  }

  .feature-hero::after {
    content: none;
  }

  .feature-hero-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    padding: .38rem .75rem;
    background: #082442;
  }

  .feature-brand {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    width: min(232px, 50%);
    height: 38px;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .feature-brand img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: left center;
  }

  .feature-stamp {
    display: block;
    width: min(195px, 34%);
    height: 38px;
    background-color: #e7c86d;
    background-image:
      linear-gradient(96deg, rgba(255,250,240,.24) 0 9%, transparent 9% 18%, rgba(8,36,66,.18) 18% 22%, transparent 22% 45%, rgba(8,36,66,.22) 45% 48%, transparent 48%),
      repeating-linear-gradient(87deg, transparent 0 12px, rgba(8,36,66,.2) 12px 14px, transparent 14px 25px);
    background-blend-mode: screen, multiply;
    -webkit-mask: url("assets/feature/DECLASSIFIED_WHITE.png") center / contain no-repeat;
    mask: url("assets/feature/DECLASSIFIED_WHITE.png") center / contain no-repeat;
    opacity: .92;
    animation: featureStampSettle .7s ease-out .18s both;
  }

  .feature-copy-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.05rem 1.25rem .85rem;
    isolation: isolate;
    background: rgba(20,35,42,.7);
  }

  .feature-copy-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background-color: rgba(20,35,42,.7);
    background-image: url("assets/feature/Kidder-NH-9-26-Hero_0.jpeg");
    background-blend-mode: multiply;
    background-size: 110%;
    background-position: 100% 22%;
    animation: featurePhotoDrift 24s ease-in-out .25s both;
  }

  .feature-copy-panel > * {
    position: relative;
    z-index: 1;
  }

  .feature-series-bar {
    display: flex;
    align-items: center;
    padding: 0 .75rem;
    background: #e7c86d;
    color: #082442;
    font-family: var(--mono);
    min-height: 17px;
    font-size: .54rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  @keyframes featurePhotoDrift {
    from {
      background-size: 108%;
      background-position: 100% 20%;
    }
    to {
      background-size: 121%;
      background-position: 72% 32%;
    }
  }

  @keyframes featureStampSettle {
    from {
      opacity: 0;
      transform: translateY(-4px) scale(1.04);
    }
    65% {
      opacity: .96;
      transform: translateY(1px) scale(.995);
    }
    to {
      opacity: .92;
      transform: translateY(0) scale(1);
    }
  }

  .feature-title {
    max-width: 590px;
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.78rem, 3.3vw, 2.9rem);
    line-height: .9;
    font-weight: 700;
    letter-spacing: 0;
    margin-bottom: .68rem;
  }

  .feature-byline {
    position: relative;
    z-index: 5;
    display: inline-block;
    width: fit-content;
    margin-bottom: .42rem;
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .feature-byline-link {
    color: rgba(255,250,240,.9);
    text-decoration: none;
    border-bottom: 1px solid rgba(231,200,109,.55);
  }

  .feature-byline-link:hover,
  .feature-byline-link:focus {
    color: #fffaf0;
    outline: none;
    border-bottom-color: #e7c86d;
  }

  .author-popover {
    position: absolute;
    left: 0;
    top: calc(100% + .42rem);
    width: min(280px, 72vw);
    padding: .45rem;
    border: 1px solid rgba(231,200,109,.85);
    background: #fffaf0;
    color: var(--ink);
    box-shadow: 0 16px 32px rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transform: translateY(5px);
    transition: opacity .16s ease, transform .16s ease;
  }

  .feature-byline:hover .author-popover,
  .feature-byline:focus-within .author-popover {
    opacity: 1;
    transform: translateY(0);
  }

  .author-popover img {
    display: block;
    width: 100%;
    aspect-ratio: 1.32;
    object-fit: cover;
    object-position: center;
    margin-bottom: .38rem;
  }

  .author-popover figcaption {
    font-family: var(--sans);
    font-size: .68rem;
    line-height: 1.28;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }

  .feature-deck {
    max-width: 520px;
    font-size: .88rem;
    line-height: 1.36;
    color: rgba(255,250,240,.86);
    margin-bottom: 0;
  }

  .feature-part {
    grid-column: span 5;
    min-height: 100px;
    padding: .88rem 1rem 1.72rem;
    border: 2px solid #e4c36f;
    background: #fffaf0;
    position: relative;
    overflow: hidden;
    color: var(--ink);
    text-decoration: none;
    transition: transform .12s ease, border-color .18s ease, box-shadow .18s ease;
  }

  .feature-part:hover {
    transform: translateY(-2px);
    border-color: #f0d783;
    box-shadow: 0 14px 32px rgba(0,0,0,.2);
  }

  .feature-part::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 7px;
    background: #e7c86d;
    z-index: 3;
    pointer-events: none;
  }

  .feature-part-label {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #7f1d1d;
    margin-bottom: .34rem;
  }

  .feature-part-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.12rem;
    line-height: 1.05;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: .36rem;
  }

  .feature-part-meta {
    font-family: var(--mono);
    font-size: .62rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #7f1d1d;
    margin-bottom: 0;
  }

  .feature-part-cta {
    position: absolute;
    left: 7px;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: 18px;
    padding: 0 .85rem 0 1rem;
    font-family: var(--mono);
    font-size: .56rem;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    border-top: 1px solid #fffaf0;
    background: #082442;
    color: #fffaf0;
    z-index: 2;
  }

  .feature-part-two .feature-part-cta {
    background: #082442;
    color: #fffaf0;
  }

  .archive-resume {
    border-top: 1px solid rgba(43,35,26,.2);
    padding-top: 1.1rem;
    margin-top: .6rem;
  }

    .card-date{
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;

  }
  .new-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--accent);
    color: #fffaf0;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    vertical-align: 1px;
  }
    .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.28rem;
    font-weight: 800;
    line-height: 1.22;
    color: var(--ink);
    margin-bottom: 0.75rem;
  }
  .card-summary {
    font-size: 0.82rem;
    color: var(--ink-mid);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-footer {
    margin-top: 0.25rem;
  display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
  }
  .card-topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }
  .card-topic {
    font-family: var(--mono);
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.1rem 0.45rem;
    border-radius: 2px;
  }
  .card-wc {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--ink-light);
    white-space: nowrap;
  }

  @media (max-width: 900px) {
    .feature-package {
      grid-template-columns: 1fr;
    }

    .feature-hero,
    .feature-part {
      grid-column: 1;
      grid-row: auto;
    }

    .feature-hero {
      min-height: 290px;
      padding: 1.5rem;
    }

    .feature-title {
      font-size: 2.65rem;
    }
  }

  /* ── Preview Panel ────────────────────────────────────── */
  .preview-panel {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .preview-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink-light);
    gap: 1rem;
    padding: 2rem;
    text-align: center;
  }
  .preview-empty svg { opacity: 0.25; }
  .preview-empty p {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-light);
  }

  .preview-header {
    padding: 1.4rem 1.6rem 1rem;
    border-bottom: 2px solid var(--rule);
    background: var(--paper-mid);
    flex-shrink: 0;
  }
  .preview-date {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
    .preview-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 900;
    line-height: 1.05;

<script>
// ===== Global helpers (must exist before init) =====
window._normLine = function(s){
  return String(s || '')
    .replace(/\s+/g,' ')
    .replace(/[“”]/g,'"')
    .replace(/[’]/g,"'")
    .trim()
    .toLowerCase();
};

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function highlight(html, q) {
  if (!q) return html;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return html.replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
}

function formatDate(isoDate) {
  if (!isoDate) return '';
  try {
    const [y, m, d] = isoDate.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
  } catch {
    return isoDate;
  }
}

function formatTileTitle(title) {
  const smallWords = new Set([
    'a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'from', 'in',
    'into', 'nor', 'of', 'on', 'or', 'over', 'per', 'the', 'to',
    'up', 'vs', 'via', 'with'
  ]);

  const words = String(title || '').split(/(\s+)/);
  const realWordIndexes = words
    .map((word, index) => /\S/.test(word) ? index : -1)
    .filter(index => index >= 0);

  const firstWord = realWordIndexes[0];
  const lastWord = realWordIndexes[realWordIndexes.length - 1];
  let forceCapNext = false;

  const capitalizeTitleWord = word => {
    const lower = word.toLowerCase();
    return lower.replace(/[a-z0-9]+(?:['’][a-z0-9]+)?/g, part => {
      if (/^\d/.test(part)) return part;
      return part.charAt(0).toUpperCase() + part.slice(1);
    });
  };

  return words.map((word, index) => {
    if (!/\S/.test(word)) return word;

    const lower = word.toLowerCase();
    const core = lower.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
    const preserve = /[A-Z]\.[A-Z]/.test(word) || /^[A-Z0-9]{2,}$/.test(word.replace(/[^A-Z0-9]/g, ''));
    const shouldLower = smallWords.has(core) && index !== firstWord && index !== lastWord && !forceCapNext;

    let formatted = word;
    if (preserve) {
      formatted = word;
    } else if (shouldLower) {
      formatted = lower;
    } else {
      formatted = capitalizeTitleWord(word);
    }

    forceCapNext = /[:;?!]$/.test(word);
    return formatted;
  }).join('');
}

// Remove stacked header lines at the start of body text that duplicate the preview header.
window.stripRedundantHeaderLines = function(text, a){
  let t = String(text || '').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!t) return t;

  const lines = t.split('\n').map(l => l.trim()).filter(Boolean);

  const wantTitle = window._normLine(a && a.title);
  const wantDate  = window._normLine(a && a.date ? formatDate(a.date) : '');

  const check = new Set([
    wantTitle,
    wantDate,
    'local commentaries',
    'local commentary',
    'opinion & commentary',
    'opinion and commentary',
    'opinion & commentaries',
    'opinion and commentaries',
    'rolland kidder',
    'by rolland kidder'
  ]);

  let i = 0;

  while(i < lines.length && i < 15){
    const raw = lines[i];
    const n = window._normLine(raw);

    // Remove bracketed placeholders like [homepage logo]
    if (/^\[.*?\]$/.test(raw)) {
      i++; continue;
    }

    // Exact matches
    if (n && check.has(n)) {
      i++; continue;
    }

    // Title match ignoring punctuation
    if (wantTitle && n && 
        n.replace(/[^a-z0-9 ]/g,'') === 
        wantTitle.replace(/[^a-z0-9 ]/g,'')) {
      i++; continue;
    }

    // Loose commentary match
    if (n.startsWith('local commentar')) {
      i++; continue;
    }

    break;
  }

  return lines.slice(i).join('\n\n').trim();
};
// ===== /Global helpers =====


// ── State ──────────────────────────────────────────────────────────────────
let allArticles = [];
let selectedId = null;
let activeTopic = 'all';

// Date filter should be OPT-IN (this fixes your 99 vs 64 problem)
let dateFilterActive = false;

function getArticleDate(a) {
  return a.dateISO || a.date || '';
}

function getNewestArticleDate() {
  return allArticles
    .map(getArticleDate)
    .filter(d => d && d !== '0001-01-01')
    .sort()
    .at(-1) || '';
}


// ── Load data ──────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(`data.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    allArticles = (json.articles || []).map((a, i) => ({ ...a, _id: i }));

    init();
  } catch (e) {
    document.getElementById('article-grid').innerHTML =
      `<div class="no-results">
        <strong>Could not load data.json</strong><br><br>
        <small style="color:var(--ink-light)">${esc(e.message)}</small>
      </div>`;
  }
}


// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  buildTopicBar();
  setDateBounds();      // sets min/max + year badge, does NOT auto-filter
  updateBadges();       // count badge + All pill count
  render();
  bindEvents();
}

function updateBadges() {
  const badge = document.getElementById('article-count-badge');
  if (badge) badge.textContent = `${allArticles.length} articles`;

  const allPill = document.querySelector('.pill.all-pill');
  if (allPill) {
    allPill.textContent = `All (${allArticles.length})`;
  }
}

function buildTopicBar() {
  const counts = {};
  allArticles.forEach(a => (a.topics || []).forEach(t => {
    counts[t] = (counts[t] || 0) + 1;
  }));

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const bar = document.querySelector('.topic-bar');
  if (!bar) return;

  // Remove existing dynamic pills (keep Topic label + All pill)
  const keep = Array.from(bar.querySelectorAll('.topic-label, .all-pill'));
  bar.innerHTML = '';
  keep.forEach(n => bar.appendChild(n));

  sorted.forEach(([topic, count]) => {
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.dataset.topic = topic;
    pill.textContent = `${topic} (${count})`;
    bar.appendChild(pill);
  });
}

function setDateBounds() {
  const dfEl = document.getElementById('date-from');
  const dtEl = document.getElementById('date-to');

  const dates = allArticles.map(a => a.date).filter(Boolean).sort();
  if (!dates.length) return;

  const minD = dates[0];
  const maxD = dates[dates.length - 1];

  // Set range limits but DO NOT set values (prevents auto-excluding undated)
  if (dfEl) { dfEl.min = minD; dfEl.max = maxD; }
  if (dtEl) { dtEl.min = minD; dtEl.max = maxD; }

  const yr = document.getElementById('year-range-badge');
  if (yr) yr.textContent = `${minD.slice(0,4)}–${maxD.slice(0,4)}`;
}


// ── Filtering & Sorting ───────────────────────────────────────────────────
function getFiltered() {
  const q   = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  const df  = (document.getElementById('date-from')?.value || '');
  const dt  = (document.getElementById('date-to')?.value || '');
  const sort = (document.getElementById('sort-select')?.value || 'date-desc');

  let results = allArticles.filter(a => {
    // Topic filter
    if (activeTopic !== 'all' && !(a.topics || []).includes(activeTopic)) return false;

    // Date filter ONLY if user activated it
    if (dateFilterActive && (df || dt)) {
      if (!a.date) return false;
      if (df && a.date < df) return false;
      if (dt && a.date > dt) return false;
    }

    // Search
    if (q) {
      const haystack = [a.title, a.summary, a.text, (a.topics||[]).join(' ')].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }

    return true;
  });

  results.sort((a, b) => {
    const da = a.date || '0000-00-00';
    const db = b.date || '0000-00-00';
    if (sort === 'date-desc') return db.localeCompare(da);
    if (sort === 'date-asc')  return da.localeCompare(db);
    if (sort === 'title-asc') return (a.title || '').localeCompare(b.title || '');
    if (sort === 'title-desc') return (b.title || '').localeCompare(a.title || '');
    if (sort === 'wc-desc')   return (b.wordCount||0) - (a.wordCount||0);
    return 0;
  });

  return results;
}

function shouldShowFeaturePackage(q) {
  if (activeTopic !== 'all') return false;
  if (q) return false;
  if (dateFilterActive) {
    const df = document.getElementById('date-from')?.value || '';
    const dt = document.getElementById('date-to')?.value || '';
    if (df || dt) return false;
  }
  return true;
}

function renderFeaturePackage(grid) {

          </a>

          </figure>
        </div>
        <div class="feature-deck">
          A two-part feature on the secret channels and first American landings that closed World War II in the Pacific.
        </div>
      </div>
      <div class="feature-series-bar">World War II Naval History · Featured Series</div>
    </div>

    <a class="feature-part feature-part-one" href="https://www.usni.org/magazines/naval-history/2026/august/declassified-part-one-negotiations-ended-world-war-ii" target="_blank" rel="noopener">
      <div class="feature-part-label">Part One</div>

      <div class="feature-part-meta">Naval History · August 2026</div>

    </a>
    <a class="feature-part feature-part-two" href="https://www.usni.org/magazines/naval-history/2026/october/declassified-part-two-how-first-americans-entered-japan-after" target="_blank" rel="noopener">

  grid.appendChild(resume);
}

  function repairHardWrapToParagraphs(text) {
  // Returns an array of paragraphs with hard-wrapped lines stitched back together.
  // This fixes cases where DOCX extraction inserts blank lines between wrapped lines.

  let t = String(text || "")
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .replace(/\u00A0/g, " ")        // nbsp
    .replace(/[ \t]+\n/g, "\n")     // trailing spaces
    .replace(/\n{3,}/g, "\n\n")     // collapse 3+ newlines
    .trim();

  if (!t) return [];

  const lines = t.split("\n");
  const paras = [];
  let buf = [];

  const flush = () => {
    if (!buf.length) return;
    const joined = buf.join(" ")
      .replace(/\s+/g, " ")
      .trim();
    if (joined) paras.push(joined);
    buf = [];
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (!line) {
      // We have a blank line. Decide if it's a real paragraph break or a fake wrap break.

      // Find the next non-empty line (lookahead)
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      const next = j < lines.length ? lines[j].trim() : "";

      if (!buf.length) continue;
      if (!next) { flush(); break; }

      const prev = buf[buf.length - 1];
      const prevLen = prev.length;

      // Heuristics:
      // - If the previous line is short-ish and does NOT end with sentence punctuation,
      //   and the next line looks like it continues text,
      //   treat blank line as a WRAP break (merge).
      //
      // This is exactly the pattern you’re seeing: each wrapped line became its own “paragraph”.
      const prevEndsSentence = /[.!?]$/.test(prev);
      const prevLooksWrapped = prevLen < 110 && !prevEndsSentence;
      const nextLooksLikeContinuation = /^[A-Z0-9(“‘"']/.test(next);

      if (prevLooksWrapped && nextLooksLikeContinuation) {
        // fake paragraph break, keep collecting
        continue;
      }

      // real paragraph break
      flush();
      continue;
    }

    buf.push(line);
  }

  flush();
  return paras;
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById('search-input')?.value || '').trim();
  const filtered = getFiltered();
  const grid = document.getElementById('article-grid');
  const newestDate = getNewestArticleDate();

  if (!grid) return;

  grid.innerHTML = '';

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">No articles match the current filters.</div>';
    const ss = document.getElementById('status-showing');
    const sf = document.getElementById('status-filter');
    if (ss) ss.textContent = '0 articles shown';
    if (sf) sf.textContent = '';
    return;
  }

  if (shouldShowFeaturePackage(q)) {
    renderFeaturePackage(grid);
  }

  filtered.forEach(a => {
    const card = document.createElement('div');
    card.className = 'article-card' + (a._id === selectedId ? ' selected' : '');
    card.dataset.id = a._id;

    const dateStr = a.date ? formatDate(a.date) : '(date unknown)';
    const isNewest = newestDate && getArticleDate(a) === newestDate;
    const topicHtml = (a.topics || []).slice(0,3).map(t =>
      `<span class="card-topic">${esc(t)}</span>`).join('');
    const displayTitle = formatTileTitle(a.title);
    const titleHtml   = q ? highlight(esc(displayTitle), q) : esc(displayTitle);

    card.innerHTML = `
      <div class="card-date">${dateStr}${isNewest ? '<span class="new-badge">NEW</span>' : ''}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-footer">
        <div class="card-topics">${topicHtml}</div>
        <div class="card-wc">${a.wordCount ? a.wordCount.toLocaleString() + ' wds' : ''}</div>
      </div>`;

    card.addEventListener('click', () => selectArticle(a._id));
    grid.appendChild(card);
  });

  // Status bar
  const active = [];
  if (activeTopic !== 'all') active.push(`topic: ${activeTopic}`);
  if (q) active.push(`search: "${q}"`);

  if (dateFilterActive) {
    const df = document.getElementById('date-from')?.value || '';
    const dt = document.getElementById('date-to')?.value || '';
    if (df || dt) active.push(`date range`);
  }

  const ss = document.getElementById('status-showing');
  const sf = document.getElementById('status-filter');

  if (ss) ss.textContent = `${filtered.length} of ${allArticles.length} articles`;
  if (sf) sf.textContent = active.length ? `Filtered by ${active.join(', ')}` : '';
}


// ── Preview ───────────────────────────────────────────────────────────────
function selectArticle(id) {
  selectedId = id;
  const a = allArticles.find(x => x._id === id);
  if (!a) return;

  // Update card selection state
  document.querySelectorAll('.article-card').forEach(c => {
    c.classList.toggle('selected', parseInt(c.dataset.id, 10) === id);
  });

  const panel = document.getElementById('preview-content');
  const empty = document.getElementById('preview-empty');
  if (!panel || !empty) return;

  empty.style.display = 'none';
  panel.style.display = 'flex';
  panel.style.flexDirection = 'column';
  panel.style.flex = '1';
  panel.style.overflow = 'hidden';

  const q = (document.getElementById('search-input')?.value || '').trim();
  const topicTags = (a.topics || []).slice(0, 3).map(t =>
    `<span class="preview-topic-tag">${esc(t)}</span>`
  ).join(' ');

  // 1) Remove redundant header lines
  const cleanedText = window.stripRedundantHeaderLines(a.text || '', a);

  // 2) Repair hard wrapping (the actual problem)
  const paragraphs = repairHardWrapToParagraphs(cleanedText);

  const bodyParagraphs = paragraphs.length
    ? paragraphs.map(p => {
        const escaped = q ? highlight(esc(p), q) : esc(p);
        return `<p>${escaped}</p>`;
      }).join('')
    : '';

  panel.innerHTML = `
    <div class="readerBar">
      <button class="readerBack" id="readerBack" type="button">Back</button>
    </div>

    <div class="preview-header">
      <div class="preview-date">
        ${a.date ? formatDate(a.date) : 'Date unknown'} &nbsp;·&nbsp; ${esc(a.filename || a.sourceFile || '')}
      </div>
      <div class="preview-title">${esc(a.title || '')}</div>
      <div class="preview-meta">
        ${topicTags}
        <div class="preview-wc">${a.wordCount ? a.wordCount.toLocaleString() + ' words' : ''}</div>
      </div>
    </div>

    <div class="preview-body">
      ${a.summary ? `<div class="preview-summary"><strong>Summary</strong>${esc(a.summary)}</div><div class="divider-gap"></div>` : ''}
      ${bodyParagraphs || '<p><em>No text available for this article.</em></p>'}
    </div>
  `;

  // open reader overlay (mobile + desktop overlay mode)
  document.body.classList.add('reader-open');
  try { history.pushState({ __readerOpen: true }, '', location.href); } catch (_) {}
}

// ── Events ────────────────────────────────────────────────────────────────
function bindEvents() {
  // Search
  const q = document.getElementById('search-input');
  if (q) q.addEventListener('input', render);

  // Sort
  const sort = document.getElementById('sort-select');
  if (sort) sort.addEventListener('change', render);

  // Dates (activates date filtering)
  const df = document.getElementById('date-from');
  const dt = document.getElementById('date-to');

  if (df) df.addEventListener('change', () => { dateFilterActive = true; render(); });
  if (dt) dt.addEventListener('change', () => { dateFilterActive = true; render(); });

  // Reset
  const reset = document.getElementById('reset-btn');
  if (reset) reset.addEventListener('click', () => {
    if (q) q.value = '';
    if (sort) sort.value = 'date-desc';

    // Clear date values and disable date filtering
    if (df) df.value = '';
    if (dt) dt.value = '';
    dateFilterActive = false;

    // Reset topic
    activeTopic = 'all';
    document.querySelectorAll('.pill').forEach(p =>
      p.classList.toggle('active', p.dataset.topic === 'all'));

    render();
  });

  // Topic pills (event delegation so it works for dynamic pills)
  const bar = document.querySelector('.topic-bar');
  if (bar) {
    bar.addEventListener('click', (e) => {
      const pill = e.target && e.target.classList && e.target.classList.contains('pill') ? e.target : null;
      if (!pill) return;

      activeTopic = pill.dataset.topic || 'all';
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      render();

      // close filters on mobile if open
      if (document.body.classList.contains('filters-open')) {
        document.body.classList.remove('filters-open');
        const btn = document.getElementById('filterToggle');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // Mobile: Filters toggle
  (function(){
    const btn = document.getElementById('filterToggle');
    const panel = document.getElementById('filterPanel');
    if(!btn || !panel) return;
    btn.addEventListener('click', () => {
      const open = document.body.classList.toggle('filters-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      const chev = btn.querySelector('.chev');
      if(chev) chev.textContent = open ? '▴' : '▾';
    });
  })();

  // Reader back
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'readerBack'){
      try { history.back(); } catch(_) { document.body.classList.remove('reader-open'); }
    }
  });

  window.addEventListener('popstate', (e) => {
    // if we popped out of reader state, close it
    if (!(e.state && e.state.__readerOpen)) {
      document.body.classList.remove('reader-open');
    }
  });
}


// ── Boot ──────────────────────────────────────────────────────────────────
loadData();
</script>
